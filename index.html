<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBD Welly!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--pink:#ef8db8;--deep:#d96699;--pale:#fff0f6;--line:#ffc5dc}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--pink);font-family:'Press Start 2P',monospace;text-align:center;overflow-x:hidden}
main{width:min(900px,100%);margin:auto;padding:30px 18px 55px}
h1{font-size:clamp(22px,5vw,43px);line-height:1.65;margin:12px 0;color:var(--pink);text-shadow:4px 4px 0 #ffe0ec}
.sub{font-size:9px;line-height:2.2;color:var(--deep);margin:0 0 25px}
.sparkles{font-size:22px;letter-spacing:9px}
.photo-frame{width:min(330px,84vw);margin:20px auto 28px;padding:9px;border:4px dashed var(--line);box-shadow:8px 8px 0 #ffe6ef;background:white;transform:rotate(-1deg)}
.photo-frame img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.section{font-size:11px;color:var(--deep);margin:25px 0 0}
.cake-area{height:245px;display:flex;align-items:flex-end;justify-content:center;margin:0 auto 8px}
.cake{position:relative;width:210px;height:130px;margin-bottom:22px;filter:drop-shadow(7px 7px 0 #ffe4ee)}
.cake-top{position:absolute;top:0;left:0;width:210px;height:35px;background:#ffc4dc;border:4px solid #df7ca7;box-shadow:inset 0 -8px #f49fc2}
.cake-top:after{content:"";position:absolute;left:13px;right:13px;top:9px;height:7px;background:#fff3f8}
.cake-side{position:absolute;top:31px;left:0;width:210px;height:91px;background:repeating-linear-gradient(90deg,#f4a3c4 0 25px,#ffd4e5 25px 50px);border:4px solid #df7ca7;border-top:0}
.cake-side:after{content:"";position:absolute;left:0;right:0;bottom:15px;height:9px;background:#fff1f7;border-top:3px solid #df7ca7;border-bottom:3px solid #df7ca7}
.candle{position:absolute;bottom:119px;width:12px;height:48px;background:repeating-linear-gradient(0deg,#fff 0 8px,#ef8db8 8px 16px);border:2px solid #d96699;z-index:3}
.c1{left:48px}.c2{left:99px;height:57px}.c3{right:48px}
.flame{position:absolute;top:-19px;left:1px;width:8px;height:15px;background:#ffb33d;border-radius:70% 20% 70% 20%;transform:rotate(45deg);box-shadow:0 0 12px #ffc85c;animation:flicker .55s infinite alternate}
.smoke{position:absolute;top:-44px;left:-2px;font:20px Arial;color:#bbb;animation:smoke 1.7s infinite ease-out}
@keyframes flicker{to{transform:rotate(52deg) scale(1.15)}}
@keyframes smoke{0%{transform:translateY(8px) scale(.7);opacity:0}35%{opacity:.8}100%{transform:translateY(-22px) translateX(8px) scale(1.4);opacity:0}}
body.blown .flame,body.blown .smoke{display:none}
button{font-family:inherit;font-size:9px;line-height:2.1;color:white;background:var(--pink);border:0;padding:16px 18px;cursor:pointer;box-shadow:6px 6px 0 #fbd5e5;max-width:95%}
button:hover{background:var(--deep)}
#message{min-height:45px;margin:22px auto 0;font-size:9px;line-height:2.2;color:var(--deep)}
.signature{margin:35px auto 0;padding:23px 8px;border-top:3px dashed var(--line);color:var(--deep);font-size:clamp(14px,3.4vw,22px);line-height:2;text-shadow:3px 3px #ffe4ef}
.signature small{display:block;font-size:8px;letter-spacing:2px;margin-bottom:10px;color:#e69abb}
.float{position:fixed;z-index:-1;pointer-events:none;color:#ffd2e3;animation:rise 8s linear infinite}
@keyframes rise{from{transform:translateY(105vh) rotate(0);opacity:0}15%{opacity:.8}to{transform:translateY(-10vh) rotate(300deg);opacity:0}}
footer{font:9px Arial;color:#e7a0bc;margin-top:20px}
@media(max-width:480px){main{padding-top:24px}.cake-area{transform:scale(.9);margin-top:-5px;margin-bottom:-5px}}
</style>
</head>
